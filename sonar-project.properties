# SonarQube Cloud (sonarcloud.io) analysis settings, used by the Code Quality stage.
# The token is never stored here: Jenkins injects SONAR_TOKEN from its credentials.
sonar.host.url=https://sonarcloud.io
sonar.organization=phatthai
sonar.projectKey=phatthai_smishguard
sonar.projectName=SmishGuard
sonar.sourceEncoding=UTF-8

# What is analysed: application code and UI. Pipeline tooling (scripts/ci) is linted by
# ESLint instead, because it only runs inside Jenkins and never ships in the image.
sonar.sources=src,public,scripts/healthcheck.js
sonar.tests=test,test-e2e
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,data/**

# Coverage comes from Jest (lcov). The browser client is exercised by the e2e suite
# rather than unit tests, so it is excluded from the coverage figure only.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=public/**,scripts/**

# ESLint findings are imported so every quality signal appears in one dashboard.
sonar.eslint.reportPaths=reports/eslint.json

# Fail the stage when the quality gate fails (the scanner waits for the result).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
