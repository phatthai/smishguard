# Alertmanager: groups, de-duplicates and routes alerts to the team's Discord channel.
# The webhook URL is a secret, so it is read from a file mounted by Docker Compose
# (sourced from the Jenkins credential "discord-webhook"), never stored in Git.
global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: discord-ops
  group_by: ["alertname", "env"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # Critical alerts notify faster, mention everyone and repeat until resolved.
    - matchers: ['severity="critical"']
      receiver: discord-oncall
      group_wait: 5s
      repeat_interval: 30m

inhibit_rules:
  # When an instance is completely down, suppress the symptom alerts it causes.
  - source_matchers: ['alertname="SmishGuardDown"']
    target_matchers: ['alertname=~"SmishGuardHealthCheckFailing|SmishGuardHighErrorRate|SmishGuardHighLatency|SmishGuardDatabaseUnavailable"']
    equal: ["env"]

receivers:
  - name: discord-ops
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        username: SmishGuard Alerts
        title: '{{ template "smishguard.title" . }}'
        message: '{{ template "smishguard.message" . }}'

  - name: discord-oncall
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        username: SmishGuard On-call
        content: '{{ if eq .Status "firing" }}@here critical alert{{ end }}'
        title: '{{ template "smishguard.title" . }}'
        message: '{{ template "smishguard.message" . }}'
