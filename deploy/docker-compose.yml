# SmishGuard application environment (infrastructure as code).
# One file serves every environment; differences live in deploy/<env>.env and in
# secrets injected by Jenkins. Used by scripts/ci/deploy.js, for example:
#   docker compose -p smishguard-staging -f deploy/docker-compose.yml --env-file deploy/staging.env up -d --wait
name: smishguard-${APP_ENV:?APP_ENV is required}

services:
  app:
    image: ${IMAGE:?IMAGE is required (the image built by the pipeline)}
    container_name: smishguard-${APP_ENV}
    restart: unless-stopped
    ports:
      # Only the API port is published. The metrics port (9464) stays private on the
      # observability network where Prometheus scrapes it.
      - "${HOST_PORT:?HOST_PORT is required}:3000"
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (injected from Jenkins credentials)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      CHECK_RATE_LIMIT_MAX: ${CHECK_RATE_LIMIT_MAX:-60}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
    volumes:
      - app-data:/app/data
    networks:
      - observability
    # Hardening: read-only root filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0.50}"
          memory: ${MEMORY_LIMIT:-256M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.smishguard.environment: ${APP_ENV}

volumes:
  app-data:
    name: smishguard-${APP_ENV}-data

networks:
  observability:
    name: smishguard-observability
    external: true
