# Prometheus: scrapes every SmishGuard environment and evaluates the alert rules.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: smishguard

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application metrics from the private metrics port of each environment.
  - job_name: smishguard
    static_configs:
      - targets: ["smishguard-production:9464"]
        labels:
          env: production
      - targets: ["smishguard-staging:9464"]
        labels:
          env: staging

  # Black-box uptime checks: probe /health from outside the app, like a user would.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://smishguard-production:3000/health"]
        labels:
          env: production
      - targets: ["http://smishguard-staging:3000/health"]
        labels:
          env: staging
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The monitoring stack monitors itself too.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
